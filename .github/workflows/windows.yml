name: windows

# BGE-Remix Windows build and tests.
# Builds Blender 2.79b (blender.exe + blenderplayer.exe) with Visual Studio 2022
# (v143) against Blender 2.79's own pre-compiled vc14 libraries, with the
# official release options. The tests run on a PC with a graphics card
# (tests/bge_remix/run_local.bat); the test job here, on Mesa's software
# OpenGL, runs only when the workflow is started by hand.

on:
  push:
  workflow_dispatch:

env:
  LIB_URL: https://svn.blender.org/svnroot/bf-blender/tags/blender-2.79a-release/lib/win64_vc14
  LIB_KEY: lib-win64_vc14-blender-2.79a-release
  OFFICIAL_URL: https://download.blender.org/release/Blender2.79/blender-2.79b-windows64.zip
  # NVIDIA PhysX 5 (P6), Apache 2.0
  PHYSX_TAG: 110.3-omni-and-physx-5.9.1
  # OpenUSD 25.11 (TOST licence, Apache 2.0-based) and oneTBB 2021.12
  # (Apache 2.0), the versions RTX Remix 1.6.1 ships (P12)
  USD_TAG: v25.11
  TBB_TAG: v2021.12.0

jobs:
  # Blender 2.79's pre-compiled Windows libraries (the 2.79a tag also covers
  # 2.79b: no library changes), fetched once and cached.
  libs:
    runs-on: windows-2022
    timeout-minutes: 120
    # one download at a time across branches and tags: svn.blender.org refuses
    # parallel downloads (P0's first run on main)
    concurrency:
      group: blender-279-libs
      cancel-in-progress: false
    steps:
      - name: Restore libraries
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: lib/win64_vc14
          key: ${{ env.LIB_KEY }}
          lookup-only: true

      - name: Download libraries (Blender SVN)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install sliksvn -y --no-progress
          $env:Path += ";C:\Program Files\SlikSvn\bin"
          $ok = $false
          for ($i = 1; $i -le 8 -and -not $ok; $i++) {
            if (Test-Path lib/win64_vc14/.svn) {
              svn cleanup lib/win64_vc14
              svn update --non-interactive --trust-server-cert lib/win64_vc14
            } else {
              svn checkout --quiet --non-interactive --trust-server-cert $env:LIB_URL lib/win64_vc14
            }
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "attempt $i failed, waiting"; Start-Sleep -Seconds (60 * $i) }
          }
          if (-not $ok) { exit 1 }
          Remove-Item -Recurse -Force lib/win64_vc14/.svn

      - name: Save libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lib/win64_vc14
          key: ${{ env.LIB_KEY }}

  # NVIDIA PhysX 5.9.1 (P6): static libraries and PhysXGpu_64.dll, built with
  # CUDA 12.8 once and cached (the key changes with build_files/physx)
  physx:
    runs-on: windows-2022
    timeout-minutes: 300
    concurrency:
      group: physx-sdk
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: blender
          sparse-checkout: build_files/physx

      - name: Restore PhysX
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: physx_sdk
          key: physx-${{ env.PHYSX_TAG }}-${{ hashFiles('blender/build_files/physx/**') }}
          lookup-only: true

      - name: CUDA 12.8
        if: steps.cache.outputs.cache-hit != 'true'
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart", "thrust", "nvtx", "visual_studio_integration"]'
          use-github-cache: false
          use-local-cache: false

      - name: PhysX source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:PHYSX_TAG --filter=blob:none --sparse https://github.com/NVIDIA-Omniverse/PhysX.git physx_src
          git -C physx_src sparse-checkout set physx
          Get-Content physx_src/physx/version.txt

      - name: Build PhysX
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          blender/build_files/physx/build_physx.ps1 -PhysX physx_src/physx -Cuda "${{ steps.cuda.outputs.CUDA_PATH }}" -Out physx_sdk 2>&1 | Tee-Object -FilePath physx_build.log
          if (-not $?) { exit 1 }
          Write-Host "PhysX build: $([math]::Round($t.Elapsed.TotalMinutes, 1)) minutes"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: physx-build-log
          path: physx_build.log
          if-no-files-found: ignore

      - name: Save PhysX
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: physx_sdk
          key: physx-${{ env.PHYSX_TAG }}-${{ hashFiles('blender/build_files/physx/**') }}

  # OpenUSD 25.11 for the RTX Remix bridge (P12): C++ only, one static
  # library, with oneTBB 2021.12; built once and cached (the key changes with
  # build_files/usd)
  usd:
    runs-on: windows-2022
    timeout-minutes: 240
    concurrency:
      group: usd-sdk
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: blender
          sparse-checkout: build_files/usd

      - name: Restore OpenUSD
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: usd_sdk
          key: usd-${{ env.USD_TAG }}-tbb-${{ env.TBB_TAG }}-${{ hashFiles('blender/build_files/usd/**') }}
          lookup-only: true

      - name: OpenUSD and oneTBB source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:TBB_TAG https://github.com/uxlfoundation/oneTBB.git tbb_src
          git clone --depth 1 --branch $env:USD_TAG https://github.com/PixarAnimationStudios/OpenUSD.git usd_src

      - name: Build OpenUSD
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          blender/build_files/usd/build_usd.ps1 -Tbb tbb_src -Usd usd_src -Out usd_sdk 2>&1 | Tee-Object -FilePath usd_build.log
          if (-not $?) { exit 1 }
          Write-Host "OpenUSD build: $([math]::Round($t.Elapsed.TotalMinutes, 1)) minutes"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: usd-build-log
          path: usd_build.log
          if-no-files-found: ignore

      - name: Save OpenUSD
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: usd_sdk
          key: usd-${{ env.USD_TAG }}-tbb-${{ env.TBB_TAG }}-${{ hashFiles('blender/build_files/usd/**') }}

  build:
    needs: [libs, physx, usd]
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: blender

      - name: Restore libraries
        uses: actions/cache/restore@v4
        with:
          path: lib/win64_vc14
          key: ${{ env.LIB_KEY }}
          fail-on-cache-miss: true

      - name: Restore PhysX
        uses: actions/cache/restore@v4
        with:
          path: physx_sdk
          key: physx-${{ env.PHYSX_TAG }}-${{ hashFiles('blender/build_files/physx/**') }}
          fail-on-cache-miss: true

      - name: Restore OpenUSD
        uses: actions/cache/restore@v4
        with:
          path: usd_sdk
          key: usd-${{ env.USD_TAG }}-tbb-${{ env.TBB_TAG }}-${{ hashFiles('blender/build_files/usd/**') }}
          fail-on-cache-miss: true

      # BGE-Remix P11 (B2): NVIDIA Blast (BSD 3-clause), the blast folder of
      # the same PhysX repo and tag, built into the PhysX backend
      - name: Blast source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:PHYSX_TAG --filter=blob:none --sparse https://github.com/NVIDIA-Omniverse/PhysX.git blast_src
          git -C blast_src sparse-checkout set blast
          Get-Content blast_src/blast/VERSION.md

      # Official 2.79b release options; CUDA kernels off (2.79b's kernels stop
      # at sm_61 and need CUDA 8, so they would not run on RTX cards anyway).
      - name: Configure
        shell: pwsh
        run: |
          cmake -S blender -B build -G "Visual Studio 17 2022" -A x64 -T v143 `
            -C blender/build_files/cmake/config/blender_release.cmake `
            -DWITH_CYCLES_CUDA_BINARIES=OFF `
            -DWITH_LTO=ON -DWITH_CPU_AVX2=ON -DWITH_MEM_MIMALLOC=ON `
            -DWITH_PHYSX=ON -DPHYSX_ROOT_DIR="$pwd/physx_sdk" -DBLAST_SOURCE_DIR="$pwd/blast_src/blast" `
            -DUSD_ROOT_DIR="$pwd/usd_sdk" `
            -DCMAKE_EXE_LINKER_FLAGS="/MAP" `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Select-String -Path configure.log -Pattern 'CMake Error' -Context 0,4 | Select-Object -First 8 |
              ForEach-Object { (@($_.Line) + $_.Context.PostContext) -join '%0A' }
            foreach ($l in $lines) { Write-Output "::error title=Configure error::$l" }
            exit 1
          }


      - name: Build
        id: build
        shell: pwsh
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          cmake --build build --config Release --target INSTALL -- /m /v:minimal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # The errors as annotations, readable on the run page without signing in
            $lines = Select-String -Path build.log -Pattern 'error C\d+|error LNK\d+|fatal error|error MSB\d+|CMake Error' |
              Select-Object -First 60 | ForEach-Object { $_.Line.Trim() }
            $i = 0
            while ($i -lt $lines.Count) {
              $chunk = $lines[$i..([math]::Min($i + 5, $lines.Count - 1))] -join '%0A'
              Write-Output "::error title=Build error::$chunk"
              $i += 6
            }
            exit 1
          }
          $t.Stop()
          "build_minutes=$([math]::Round($t.Elapsed.TotalMinutes, 1))" | Tee-Object -FilePath build/bin/Release/BUILD_TIME.txt
          # BGE-Remix P8: the linker writes its maps (blender.map,
          # blenderplayer.map: function addresses, to read crash dumps) next
          # to the programs in build/bin/Release, so they go with them

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore

      # The fake RTX Remix runtime the tests use, in the build's download
      # (the tests run on a PC with a graphics card since P8 Part B)
      - name: Build the fake Remix runtime (for the tests)
        shell: pwsh
        run: |
          cmake -S blender/tests/bge_remix/p1/mock_remix -B mockbuild -G "Visual Studio 17 2022" -A x64
          cmake --build mockbuild --config Release -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $m = "build/bin/Release/bge_remix_test_mock"
          New-Item -ItemType Directory -Force "$m/mock", "$m/mock_shim" | Out-Null
          Copy-Item mockbuild/Release/d3d9.dll "$m/mock/"
          Copy-Item mockbuild/Release/d3d9.dll, mockbuild/Release/d3d9_x64.dll, mockbuild/Release/remixdep.dll "$m/mock_shim/"

      # P12: the bridge's OpenUSD, from the built bridge DLL (no Remix, no
      # graphics card): not started by loading the bridge, then a stage with a
      # mesh, an RTX Remix material and a rigid body written and read back,
      # and an RTX Remix capture read
      - name: OpenUSD check
        shell: pwsh
        run: |
          cmake -S blender/tests/bge_remix/p12/native -B p12native -G "Visual Studio 17 2022" -A x64
          cmake --build p12native --config Release -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force usd_check_out | Out-Null
          # P12 round 2: the test room written as an RTX Remix capture, read
          # through the bridge (its textures decoded) and checked
          python blender/tests/bge_remix/p12/capture_writer.py usd_check_out/capture room
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dds = Get-ChildItem usd_check_out/capture/textures -Filter *.dds | ForEach-Object { $_.FullName }
          p12native/Release/p12_usd_check.exe build/bin/Release/bge_remix_bridge.dll usd_check_out `
            usd_check_out/capture/capture_room.usda usd_check_out/capture_dump.json @dds
          $code = $LASTEXITCODE
          Write-Output "p12_usd_check ended with $code"
          if ($code -ne 0) { Write-Output "::error title=OpenUSD check::some checks failed (see the log; ended with $code)"; exit 1 }
          python blender/tests/bge_remix/p12/native/check_capture.py usd_check_out/capture/expected.json usd_check_out/capture_dump.json
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=OpenUSD check::the capture was not read as written (see the log)"; exit 1 }
          # P12 round 3: a small mod written by the exporter's writer, read
          # back through the bridge and checked
          python blender/tests/bge_remix/p12/native/check_mod.py write usd_check_out/mod
          if ($LASTEXITCODE -ne 0) { exit 1 }
          p12native/Release/p12_usd_check.exe build/bin/Release/bge_remix_bridge.dll --dump usd_check_out/mod/mod.usda usd_check_out/mod_dump.json
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=OpenUSD check::the mod did not read back (see the log)"; exit 1 }
          python blender/tests/bge_remix/p12/native/check_mod.py check usd_check_out/mod usd_check_out/mod_dump.json
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=OpenUSD check::the mod was not read as written (see the log)"; exit 1 }
          # P12 round 6: a scene written by the USD export's writer (and as
          # .usdc), another tool's file and one with what the import does not
          # take, each read through the bridge as the import reads it
          python blender/tests/bge_remix/p12/native/check_scene.py write usd_check_out/scene
          if ($LASTEXITCODE -ne 0) { exit 1 }
          p12native/Release/p12_usd_check.exe build/bin/Release/bge_remix_bridge.dll --convert usd_check_out/scene/exchange.usda usd_check_out/scene/exchange.usdc
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=OpenUSD check::the scene was not converted to .usdc (see the log)"; exit 1 }
          foreach ($pair in @(@("exchange.usda", "exchange.json"), @("exchange.usdc", "exchange_c.json"), @("other_tool.usda", "other_tool.json"), @("unsupported.usda", "unsupported.json"))) {
            p12native/Release/p12_usd_check.exe build/bin/Release/bge_remix_bridge.dll --scene "usd_check_out/scene/$($pair[0])" "usd_check_out/scene/$($pair[1])"
            if ($LASTEXITCODE -ne 0) { Write-Output "::error title=OpenUSD check::$($pair[0]) was not read (see the log)"; exit 1 }
          }
          python blender/tests/bge_remix/p12/native/check_scene.py check usd_check_out/scene
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=OpenUSD check::the scenes were not read as written (see the log)"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: blendremix-win64
          path: build/bin/Release

      # P6: the PhysX backend on its own (CPU scenes, no Blender): stacking,
      # bounce, friction, sensors, rays, joints, character, vehicle
      - name: PhysX native checks
        shell: pwsh
        run: |
          cmake -S blender/tests/bge_remix/p6/native -B p6native -G "Visual Studio 17 2022" -A x64 -DPHYSX_ROOT_DIR="$pwd/physx_sdk" -DBLAST_SOURCE_DIR="$pwd/blast_src/blast"
          cmake --build p6native --config Release -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          p6native/Release/p6_physx_checks.exe
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=PhysX native checks::some checks failed (see the log)"; exit 1 }

  # BGE-Remix P10: the pre-flight (every push, no graphics card): the test
  # scripts compile, and every test scene of P9 and P10 is made in a
  # background Blender; a scene that cannot be made fails here, not on the
  # PC's run
  preflight:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: blender

      - uses: actions/download-artifact@v4
        with:
          name: blendremix-win64
          path: ours

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The test scripts compile
        shell: pwsh
        run: |
          python -m compileall -q blender/tests/bge_remix
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Pre-flight::a test script does not compile"; exit 1 }

      - name: No undefined names in the test scripts
        shell: pwsh
        run: |
          # (P11: a name left out of an edit stopped a whole RTX run)
          python -m pip install --quiet pyflakes
          $bad = python -m pyflakes blender/tests/bge_remix 2>&1 | Select-String "undefined name"
          if ($bad) { $bad | ForEach-Object { Write-Output "::error title=Pre-flight::$_" }; exit 1 }
          # (pyflakes ends with 1 for any remark, unused imports too: only
          # undefined names fail the step)
          exit 0

      - name: The P9, P10, P11 and P12 test scenes are made
        shell: pwsh
        run: |
          $bl = Get-ChildItem ours -Recurse -Filter blender.exe | Select-Object -First 1
          $bad = 0
          foreach ($p in @(@("p9", "make_scenes_p9.py", "p9_expected.json"), @("p10", "make_scenes_p10.py", "p10_expected.json"), @("p11", "make_scenes_p11.py", "p11_expected.json"), @("p12", "make_scenes_p12.py", "p12_expected.json"))) {
            $out = "preflight/$($p[0])"
            New-Item -ItemType Directory -Force $out | Out-Null
            $env:BGE_REMIX_CONVERT = "0"
            & $bl.FullName --background --factory-startup --python "blender/tests/bge_remix/$($p[0])/$($p[1])" -- $out *> "$out/make.log"
            $e = Get-Content "$out/$($p[2])" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            if (-not $e) {
              Write-Output "::error title=Pre-flight $($p[0])::the scene maker wrote no $($p[2]) (see make.log)"; $bad = 1
            }
            else {
              foreach ($k in $e.failed.PSObject.Properties.Name) {
                Write-Output "::error title=Pre-flight $($p[0])::the $k scenes could not be made"; $bad = 1
              }
              foreach ($t in $e.PSObject.Properties) {
                if ($t.Value -and $t.Value.PSObject.Properties.Name -contains "failed") {
                  foreach ($k in $t.Value.failed.PSObject.Properties.Name) {
                    Write-Output "::error title=Pre-flight $($p[0])::$($t.Name): the $k scenes could not be made"; $bad = 1
                  }
                }
              }
            }
          }
          exit $bad

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight
          path: preflight/*/*.log

  # Since P8 Part B the tests run on a PC with a graphics card
  # (tests/bge_remix/run_local.bat); this job runs only when started by hand
  # (Actions, "Run workflow")
  test:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    # P8 Part B plays about 150 more scenes on software OpenGL
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: blender

      - uses: actions/download-artifact@v4
        with:
          name: blendremix-win64
          path: ours

      - name: Official Blender 2.79b
        shell: pwsh
        run: |
          Invoke-WebRequest $env:OFFICIAL_URL -OutFile official.zip
          Expand-Archive official.zip -DestinationPath .
          Get-ChildItem blender-2.79b-windows64 | Select-Object -First 5 Name

      - name: Mesa software OpenGL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --output mesa.7z
          7z x mesa.7z -omesa | Out-Null
          Get-ChildItem mesa/x64 -Filter *.dll | Select-Object Name

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # BGE-Remix P8: a crash of Blender or the player leaves a small dump
      # (Windows Error Reporting) in results/dumps, read with the linker maps
      - name: Crash dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results/dumps | Out-Null
          foreach ($exe in "blender.exe", "blenderplayer.exe") {
            $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exe"
            New-Item -Path $k -Force | Out-Null
            New-ItemProperty -Path $k -Name DumpFolder -PropertyType ExpandString -Value "$pwd\results\dumps" -Force | Out-Null
            New-ItemProperty -Path $k -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $k -Name DumpCount -PropertyType DWord -Value 30 -Force | Out-Null
          }
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1 -Type DWord

      - name: Phase 0 tests (T1.7 regression, B1.1 startup)
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python -m pip install --quiet pillow numpy
          python blender/tests/bge_remix/p0/run_p0.py --ours ours --official blender-2.79b-windows64 --out results --mesa mesa/x64

      # The fake RTX Remix runtime (d3d9.dll) for the phase 1 tests
      - name: Build the fake Remix runtime
        shell: pwsh
        run: |
          cmake -S blender/tests/bge_remix/p1/mock_remix -B mockbuild -G "Visual Studio 17 2022" -A x64
          cmake --build mockbuild --config Release -- /m /v:minimal
          New-Item -ItemType Directory -Force mock, mock_shim | Out-Null
          Copy-Item mockbuild/Release/d3d9.dll mock/
          Copy-Item mockbuild/Release/d3d9.dll, mockbuild/Release/d3d9_x64.dll, mockbuild/Release/remixdep.dll mock_shim/

      - name: Phase 1 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p1/run_p1.py --ours ours --mock mock --mock-shim mock_shim --out results/p1

      - name: Phase 2 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p2/run_p2.py --ours ours --mock mock --out results/p2

      - name: Phase 3 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p3/run_p3.py --ours ours --mock mock --official blender-2.79b-windows64 --out results/p3

      - name: Phase 4 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p4/run_p4.py --ours ours --mock mock --official blender-2.79b-windows64 --out results/p4

      - name: Phase 5 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p5/run_p5.py --ours ours --mock mock --out results/p5

      - name: Phase 6 tests (PhysX on the CPU)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p6/run_p6.py --ours ours --official blender-2.79b-windows64 --out results/p6

      - name: Phase 7 tests (the Game View)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p7/run_p7.py --ours ours --official blender-2.79b-windows64 --mock mock --out results/p7

      - name: Phase 8 tests (plan v2 Parts A and B, OpenGL 4.5, the game's drawing, lights, shadows, sky, reflections, volumes)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p8/run_p8.py --ours ours --official blender-2.79b-windows64 --mock mock --out results/p8

      - name: Crash dumps and maps
        if: always()
        shell: pwsh
        run: |
          $dumps = Get-ChildItem results/dumps -Filter *.dmp -ErrorAction SilentlyContinue
          # a crash the console debugger caught prints "BGE-Remix crash" (run_p8.py)
          $caught = Select-String -Path results/p8/*.log -Pattern '^BGE-Remix crash\s*$' -List -ErrorAction SilentlyContinue
          if ($dumps -or $caught) {
            $dumps | ForEach-Object { Write-Output "::warning title=Crash dump::$($_.Name)" }
            $caught | ForEach-Object { Write-Output "::warning title=Crash caught::$($_.Filename)" }
            Copy-Item ours/*.map results/dumps/ -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-results
          path: results
